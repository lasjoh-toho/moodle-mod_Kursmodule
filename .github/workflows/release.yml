name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mod_kursmodule zip
        run: |
          mkdir -p build/mod
          cp -r mod_kursmodule build/mod/kursmodule
          (cd build/mod && zip -r ../../moodle-mod_kursmodule-${GITHUB_REF_NAME}.zip kursmodule)

      - name: Build enrol_kursmodule zip
        run: |
          mkdir -p build/enrol
          cp -r enrol_kursmodule build/enrol/kursmodule
          (cd build/enrol && zip -r ../../moodle-enrol_kursmodule-${GITHUB_REF_NAME}.zip kursmodule)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            moodle-mod_kursmodule-${{ github.ref_name }}.zip
            moodle-enrol_kursmodule-${{ github.ref_name }}.zip
          generate_release_notes: true
